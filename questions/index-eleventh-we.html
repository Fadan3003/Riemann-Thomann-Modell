<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wechsel</title>
    <link rel="stylesheet" href="https://fadan3003.github.io/css_main/style.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <img 
            src="https://th.bing.com/th/id/R.307e84c1fe45c8b35d1df1fa8027bb90?rik=f5VirOls8G2KPw&pid=ImgRaw&r=0" 
            alt="Logo"
            size="100px" 
            width="100px" 
            height="100px"
        >

        <h3>Fadan</h3>
    
    </header>

    <div class="login">
        <h1>Wechsel</h1>
        <h2>Ich bin leider so inkonsequent</h2>
        <div class="option">
            <input type="radio" id="option1" name="wechsel">
            <label for="option1">ja</label>
        </div>
        <div class="option">
            <input type="radio" id="option2" name="wechsel">
            <label for="option2">teilweise</label>
        </div>
        <div class="option">
            <input type="radio" id="option3" name="wechsel">
            <label for="option3">nein</label>
        </div>
        <button onclick="submitButton()">Submit</button>
    </div>

    <script>
        const submitButton = () => {
            const selectedOption = document.querySelector('input[name="wechsel"]:checked');
            if (!selectedOption) {
                alert("Bitte wählen Sie eine Option aus.");
                return;
            }

            let dauerWechsel = Number(localStorage.getItem("dauer-wechsel")) || 0;

            if (selectedOption.id === "option1") {
                dauerWechsel -= 1;
            } else if (selectedOption.id === "option2") {
                dauerWechsel -= 0.5;
            }

            localStorage.setItem("dauer-wechsel", dauerWechsel);
            
            window.location.href = "index-twelfth-we.html";
        }

    </script>
   
</body>
</html>
